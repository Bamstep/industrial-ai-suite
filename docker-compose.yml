version: '3.8'

services:
  cad-gdt-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad_gdt_inspection_engine
    ports:
      - "8000:8000"
    environment:
      - WORKERS=2
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
