name: Industrial AI Suite CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0 libosmesa6 libosmesa6-dev libglew-dev libglfw3-dev tesseract-ocr xvfb

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx starlette fastapi uvicorn numpy opencv-python pydantic scipy openpyxl websockets
        pip install -e robotics-digital-twin
        pip install -e pipeline-vision-inspector
        pip install -e turbomachinery-pdm

    - name: Run Robotics Twin Tests
      run: xvfb-run -a pytest robotics-digital-twin/tests/ -v

    - name: Run Pipeline Vision Tests
      run: pytest pipeline-vision-inspector/tests/ -v

    - name: Run Turbomachinery PdM Tests
      run: pytest turbomachinery-pdm/tests/ -v
