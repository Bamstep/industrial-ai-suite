name: Industrial AI Metrology CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up System Libraries for OpenCV & OCR
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python-headless pytest numpy scipy fastapi uvicorn pydantic python-multipart openpyxl PyMuPDF python-jose passlib bcrypt sqlalchemy httpx

    - name: Execute Full Metrology Test Suite
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v
