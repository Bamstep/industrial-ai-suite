[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-digital-twin"
version = "0.1.0"
description = "Autonomous Robotics & Digital Twin Platform with kinematics, dynamics, visual servoing, and 3D telemetry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
    "mujoco>=3.0.0",
    "opencv-python-headless>=4.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]